<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial;
        }

        h1 {
            margin: 10px;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: grey;
            padding: 20px;
            min-height: 100vh;

        }

        .card {
            border: 1px solid white;
            border-radius: 10px;
            padding: 24px;
            margin: 370px;
            background-color: white;
            border-radius: 3px;
            max-width: 290vw;
            box-shadow: inset;
        }

        label {
            margin: 15px;
            color: black;
            font-weight: bold;
            /* padding:5px; */
        }

        button {
            color: White;
            font-weight: bold;
            background-color: green;
            padding: 16px;
            border-radius: 20px;
            margin: 0px auto;
            width: 100%;
            display: flex;
            justify-items: center;
            /* align-items: center; */
            justify-content: center;
            cursor: pointer;
        }

        .btn:hover {
            background-color: blue;
        }

        footer {
            display: flex;
            align-items: center;
            justify-content: center;
            color: grey;
            margin-top: 50px;
        }

        input {
            border: 1px solid grey;
            padding: 13px;
            margin: 10px;
            width: 100%;
            border-radius: 20px;
            box-sizing: border-box;

        }

        .gender,
        .hobby {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin: 5px 0 15px 0
        }

        .gender input[type="radio"],
        .hobby input[type="checkbox"] {
            width: auto;
            margin: 0 ;
        }

        .gender label {
            display: inline;
            font-weight: normal;
        }

        select {
            border: 1px solid grey;
            padding: 13px;
            margin: 10px;
            width: 100%;
            border-radius: 20px;
            box-sizing: border-box;
        }

        /* .hobby {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-top: 5px;
            margin-bottom: 5px;
        } */

        .hobby label {
            display: inline;
            font-weight: normal;
        }

        a {
            text-decoration: none;
            color: cornflowerblue;
            display: flex;
            justify-content: center;
            margin: 45px;
        }
    </style>

</head>

<body>
    <div class="card">
        <form>
            <h1 style="color:purple;">Student Registration</h1>
            <label for="fname">Full Name</label><br>
            <input type="text" id="fname" name="name" placeholder="Enter your full name"><br>
            <label for="email">Email Address</label><br>
            <input type="email" id="email" name="email" placeholder="example@student.com"><br>
            <label for="password">Password</label><br>
            <input type="password" id="password" name="password" placeholder="Create a strong password"><br>
            <!-- //checkbox -->
            <label>Gender</label>
            <div class="gender">

                <input type="radio" id="male" name="gender">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender">
                <label for="other">Other</label><br>

            </div>

            <label for="city">City</label><br>
            <input type="text" id="city" name="city" placeholder="Enter your city"><br>
            <label for="course">Select Course </label><br>
            <div class="courses">
                <select type="list" id="course" name="course"><br>
                    <option value="" disabled selected hidden>-- Choose a course --</option>
                    <option value="1">HTML</option>
                    <option value="2">CSS</option>
                    <option value="3">JAVASCRIPT</option>
                    <option value="4">RUBY</option>
                    <option value="5">FLUTTER</option>
            </div>

            </select><br>
            <!-- Hobbies -->
            <label for="hobby">Hobbies</label><br>
            <div class="hobby">
                <input type="checkbox" id="reading" name="read">
                <label for="reading">Reading</label>
                <input type="checkbox" id="coding" name="code">
                <label for="coding">Coding</label>
                <input type="checkbox" id="sports" name="sport">
                <label for="sports">Sports</label><br>
            </div>
            <button class="btn">Register Now</button>


        </form>
        <a href="">Privacy policy</a>
        <footer>
            &copy; 2026 Student Portal all rights reserved
        </footer>
    </div>

</body>

</html>
