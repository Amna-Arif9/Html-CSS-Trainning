<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Edit</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ul li{
            /* list-style-type: none; */
            list-style: none;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            
        }
        .container{
            border: 1px solid gray;
            max-width: 1000px;
            width: 90%;
            margin: 0 auto;
            border-radius: 12px;
            padding: 15px;
        }
        .items ul{
            display: flex;
            justify-items: center;
            align-items: center;
            gap: 30px;
        }
        .items ul li{
        font-weight: bold;

        }
        .logo img{
            width: 150px;
        }
        .abar{
       text-align: center;
       background-color: rgb(219, 219, 48);       margin: 8px;
       width:100%;
       align-items: center;
       justify-content: center;
       padding: 8px;
       box-sizing: border-box;
        }
        .Info{
            display: inline-flex;
            align-items: center;
        }
        .banner{
            /* text-decoration: none; */
            color: black;
            font-weight: bold;
        }
        .container span{
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <header>
        <div class="abar">
            <p>UE Core & Enterprise Subscriptions: Get <strong>10% Off</strong> on your second year <span class="Info">&#9432</span>
            <a href="" class="banner">Buy Now &rarr;</a></p>
             

        </div>
    <nav class="container">
         <div class="logo">
            <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE-logo.svg" alt="">
         </div>
         <div class="items">
            <ul>
                <li>Product </li>
                <li>Buy</li>
                <li>Renew</li>
                <li>Support</li>
                <li>Run</li>
                <li>Company</li>
            </ul>
         </div>
    </nav>
    </header>
   
</body>
</html>
