<!-- Audio & Video Player -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player</title>
</head>
<body>
    <h1>Video Player</h1>
    <video src="Video1.mp4" width="300" height="300"controls ></video>
    <video src="Video2.mp4" width="300" height="300"controls ></video>
    <video src="Video3.mp4" width="300" height="300"controls ></video>
    <video src="Video4.mp4" width="300" height="300"controls ></video>
    <h2>Audio Player</h2>
    <audio src="audio1.mp3"controls></audio>
    <audio src="audio2.mp3"controls></audio>
    <audio src="audio3.mp3"controls></audio>
    <audio src="audio4.mp3"controls></audio>
    <audio src="audio5.mp3"controls></audio>
    <audio src="audio6.mp3"controls></audio>

    
</body>
</html>
